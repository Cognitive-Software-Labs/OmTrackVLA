name: Repository checks
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependencies (numerical/image only; pins match requirements/inference.txt)
        run: python -m pip install numpy==1.26.4 Pillow==10.3.0
      - name: Contract tests (no models or GPU)
        run: python -m unittest discover -s tests -v
      - name: Syntax
        run: |
          python -m compileall -q real_robot scripts tests omtrack training sim infer_sample.py
          bash -n setup.sh run_local.sh sim/eval.sh sim/stt_data.sh real_robot/start_omtrack_ridgeback.sh real_robot/start_omtrack_preview.sh
